<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ласкаво просимо до Assi</title>

    <!-- Google Fonts: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="/static/main.css">
</head>
<body>
    <!-- Header with logo and icons -->
    <header class="header">
        <div class="header-logo">
            <svg width="45" height="45" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                <g>
                    <circle cx="16" cy="16" r="15" fill="none" stroke="#F8F8F8" stroke-width="2"/>
                    <path d="M26,27c0-5.523-4.477-10-10-10s-10,4.477-10,10" fill="none" stroke="#F8F8F8" stroke-width="2"/>
                    <circle cx="16" cy="11" r="6" fill="none" stroke="#F8F8F8" stroke-width="2"/>
                </g>
            </svg>
        </div>
        <p class="header-title">20.034</p>
        <div class="header-icon">
            <!-- Placeholder for additional SVG icon -->
            <svg class="svg-icon" style="width:1em;height:1em;fill:currentColor;" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
                <path d="..."/>
            </svg>
        </div>
    </header>

    <!-- Main content section -->
    <main>
        <!-- Navigation links section -->
        <section class="main-div">
            <ul class="nav-list">
                <li><a href="#"><svg><!-- icon --></svg>Text</a></li>
                <li><a href="#"><svg><!-- icon --></svg>Text</a></li>
                <li><a href="#"><svg><!-- icon --></svg>Text</a></li>
                <li><a href="#"><svg><!-- icon --></svg>Text</a></li>
            </ul>
        </section>

        <!-- Schedule button and link -->
        <section class="main-div">
            <a href="#"><svg><!-- icon --></svg>Link to schedule</a>
            <button id="open-schedule">
                <div><svg><!-- icon --></svg></div>
            </button>
        </section>

        <!-- Asset icons -->
        <section id="asset">
            <a href="#" class="asset"><svg><!-- icon --></svg></a>
            <a href="#" class="asset"><svg><!-- icon --></svg></a>
        </section>
    </main>

    <!-- Schedule popup -->
    <section id="schedule" style="display: none;">
        <img src="/static/schedule.jpg" alt="Schedule">
        <button id="close-schedule">Close</button>
    </section>

    <!-- JavaScript for schedule popup -->
    <script>
        window.onload = function () {
            const openBtn = document.getElementById('open-schedule');
            const closeBtn = document.getElementById('close-schedule');
            const schedule = document.getElementById('schedule');

            openBtn.addEventListener("click", () => {
                schedule.style.display = 'flex';
            });

            closeBtn.addEventListener("click", () => {
                schedule.style.display = 'none';
            });
        };
    </script>

    <!-- Footer with buttons -->
    <footer>
        <div class="footer-container">
            <div class="footer-element vector">
                <a href="#"><svg><!-- icon --></svg></a>
            </div>
            <div class="footer-element mbutton">
                <a href="#" class="footer-btn"><svg><!-- icon --></svg></a>
            </div>
            <div class="footer-element leadboard">
                <a href="#" class="footer-btn"><svg><!-- icon --></svg></a>
            </div>
        </div>
    </footer>
</body>
</html>
